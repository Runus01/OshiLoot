<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find treasures for your oshi! Anime merch that ships to you, lined up by your MyAnimeList scores." />
    <!-- From src/assets, so each build gives them a new hashed name: the deploy caches files
         for a year, and a changed icon would otherwise never reach returning visitors. -->
    <link rel="icon" href="/src/assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/src/assets/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a1f3b" />
    <!-- The preview card in Telegram, WhatsApp, Discord, LinkedIn and others. The build makes
         the image address absolute when VITE_SITE_URL is set (see vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OshiLoot" />
    <meta property="og:title" content="OshiLoot: Find treasures for your oshi" />
    <meta property="og:description" content="Anime merch that ships to you, lined up by your MyAnimeList scores." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The OshiLoot mascot, a smiling anime girl with star eyes, beside the words Find treasures for your oshi" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>OshiLoot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
