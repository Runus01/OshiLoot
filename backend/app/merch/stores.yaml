# Stores the app knows about. Add a store here; add an adapter only if it has an API.
#
# type:     ebay_api = live listings through an adapter; linkout = a search link only
# term:     which title to search with (ja falls back to the main title when missing)
# ships_to: "*" or a list of country codes; exclude removes countries from "*"
# markets:  per-country search URLs (the store only appears in those countries)
#
# Search URL templates use {q} for the URL-encoded search term. Check each one by
# running a search on the site and comparing the address bar. Checked against a live
# example: Carousell SG, CDJapan, Otaku House and Kinokuniya Singapore.

stores:
  - id: ebay
    name: eBay
    kind: second_hand
    type: ebay_api
    term: en
    search_url: "https://www.ebay.com/sch/i.html?_nkw={q}"

  - id: cdjapan
    name: CDJapan
    kind: official
    type: linkout
    term: ja
    search_url: "https://www.cdjapan.co.jp/searchuni?q={q}"
    affiliate_template_setting: cdjapan_affiliate_template

  - id: amiami
    name: AmiAmi
    kind: official
    type: linkout
    term: en
    search_url: "https://www.amiami.com/eng/search/list/?s_keywords={q}"

  - id: hlj
    name: HobbyLink Japan
    kind: official
    type: linkout
    term: en
    search_url: "https://www.hlj.com/search/?q={q}"

  - id: mercari_jp
    name: Mercari
    kind: second_hand
    type: linkout
    term: ja
    markets:
      JP: "https://jp.mercari.com/search?keyword={q}"

  - id: buyee_mercari
    name: Mercari Japan via Buyee
    kind: second_hand
    type: linkout
    term: ja
    exclude: [JP]
    search_url: "https://buyee.jp/mercari/search?keyword={q}"

  - id: carousell
    name: Carousell
    kind: second_hand
    type: linkout
    term: en
    markets:
      SG: "https://www.carousell.sg/search/{q}/"
      MY: "https://www.carousell.com.my/search/{q}/"
      HK: "https://www.carousell.com.hk/search/{q}/"
      PH: "https://www.carousell.ph/search/{q}/"
      TW: "https://tw.carousell.com/search/{q}/"
      ID: "https://id.carousell.com/search/{q}/"

  # Singapore's own online anime shop. Its physical stores (Plaza Singapura, VivoCity) have
  # closed. The site blocks automated checks, so this pattern is unverified.
  - id: hakken
    name: Hakken!
    kind: official
    type: linkout
    term: en
    markets:
      SG: "https://www.hakkenonline.com/search/?q={q}"

# Shops to visit in person, by country code. Outlets open and close, so these were checked
# in October 2026 against each shop's own site or recent news; re-check before relying on
# them. search_url is the shop's online store, if it has one ({q} as above).
shops:
  SG:
    - id: la_tendo
      name: La Tendo
      note: Figures, gashapon, plushies and anime goods. The AmiAmi Singapore store is inside.
      website: "https://latendo.com/"
      outlets:
        - name: Suntec City
          address: "3 Temasek Boulevard, #03-354, Suntec City, Singapore 038983"

    - id: otaku_house
      name: Otaku House
      note: Anime merchandise, figures and collaboration goods.
      website: "https://shop.otakuhouse.com/"
      search_url: "https://shop.otakuhouse.com/search?q={q}"
      outlets:
        - name: Suntec City
          address: "3 Temasek Boulevard, #02-489, Suntec City, Singapore 038983"
        - name: Jewel Changi Airport
          address: "78 Airport Boulevard, #04-240, Jewel Changi Airport, Singapore 819666"

    - id: kinokuniya
      name: Books Kinokuniya
      note: Manga, light novels, art books and character goods.
      website: "https://kinokuniya.com.sg/"
      search_url: "https://kinokuniya.com.sg/search?q={q}"
      outlets:
        - name: Ngee Ann City (main store)
          address: "391 Orchard Road, #04-20, Ngee Ann City, Singapore 238872"
        - name: Bugis Junction
          address: "200 Victoria Street, #03-09, Bugis Junction, Singapore 188021"
        - name: Raffles City
          address: "Level 3, Raffles City Shopping Centre, 252 North Bridge Road, Singapore 179103"
