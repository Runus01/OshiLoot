version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: monthly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    groups: { frontend: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /infra
    schedule: { interval: monthly }
    groups: { infra: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
