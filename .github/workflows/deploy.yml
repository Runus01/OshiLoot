name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling a half-finished deploy.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write # lets GitHub hand AWS a short-lived OIDC token; no stored AWS keys
  contents: read

jobs:
  deploy:
    # Skipped until AWS is set up: add the AWS_DEPLOY_ROLE_ARN repository variable (README).
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
    steps:
      - uses: actions/checkout@v5

      # Signs in with GitHub's OIDC token, unless the AWS_ACCESS_KEY_ID and
      # AWS_SECRET_ACCESS_KEY secrets are set (accounts that can't use OIDC, see README).
      # Either way, the run ends up with an hour-long session as the deploy role.
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The Lambda Web Adapter image is only on ECR Public, where anonymous pulls fail with
      # "429 ... Data limit exceeded" on shared runners. Signing in lifts that limit.
      - name: Sign in to ECR Public for the Lambda adapter image
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Build and push the backend image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/oshiloot-backend:${{ github.sha }}
        run: |
          # --provenance=false: Lambda rejects the multi-manifest images BuildKit makes by default
          docker build --platform linux/amd64 --provenance=false -t "$IMAGE" backend
          docker push "$IMAGE"

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deploy OshiLootApp
        working-directory: infra
        env:
          # Optional, for your own domain (README): e.g. "oshiloot.com,www.oshiloot.com"
          # and the ARN of a us-east-1 certificate that covers them. Empty: CloudFront's address.
          SITE_DOMAINS: ${{ vars.SITE_DOMAINS }}
          SITE_CERTIFICATE_ARN: ${{ vars.SITE_CERTIFICATE_ARN }}
        run: |
          npm ci
          npx cdk deploy OshiLootApp --require-approval never \
            -c imageTag=${{ github.sha }} -c githubRepo=${{ github.repository }} \
            -c "domainNames=$SITE_DOMAINS" -c "certificateArn=$SITE_CERTIFICATE_ARN" \
            --outputs-file outputs.json

      - name: Upload the frontend
        run: |
          BUCKET=$(jq -r '.OshiLootApp.SiteBucketName' infra/outputs.json)
          DISTRIBUTION=$(jq -r '.OshiLootApp.DistributionId' infra/outputs.json)
          cd frontend
          npm ci
          npm run build
          # Hashed asset files never change, so browsers may cache them for a year;
          # index.html points at the current ones, so it must always be revalidated.
          aws s3 sync dist "s3://$BUCKET" --delete --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths "/index.html" > /dev/null

      - name: Smoke test
        run: |
          # Checked at CloudFront's own address, which answers whatever your DNS says.
          CDN=$(jq -r '.OshiLootApp.DistributionDomainName' infra/outputs.json)
          URL=$(jq -r '.OshiLootApp.SiteUrl' infra/outputs.json)
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "https://$CDN/api/healthz"
          echo "Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"
