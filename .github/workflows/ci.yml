name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint and format
        run: ruff check . && ruff format --check .
      - name: Module boundaries
        run: lint-imports
      - name: Tests
        run: pytest
      # Builds the app stage only. The Lambda adapter comes from ECR Public, whose anonymous
      # pulls fail on shared CI runners (429), and CI has no AWS credentials to sign in.
      # The deploy workflow signs in and builds the full image.
      - name: Container builds
        run: docker build --provenance=false --target app -t oshiloot-backend .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Synthesize stacks (no AWS access needed)
        run: |
          npx cdk synth --quiet -c githubRepo=ci/check
          npx cdk synth --quiet -c githubAuth=keys -c domainNames=example.com,www.example.com \
            -c certificateArn=arn:aws:acm:us-east-1:123456789012:certificate/00000000-0000-0000-0000-000000000000
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: us-west-2
